  <body class="bg-slate-50 text-ocean-950 font-sans antialiased pb-safe">
    <div id="root">
      <div id="boot-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#1d5fa8 0%,#0A2242 70%);color:#fff;font-family:system-ui,sans-serif">
        <img src="/icons/icon-192.png" width="96" height="96" alt="" style="border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:bootpulse 1.4s ease-in-out infinite">
