<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c4a6e">
  <title>Sem conexão · Lagos GO</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #082f49; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 20px; }
    h1 { font-size: 20px; margin: 20px 0 8px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
    button { background: #0284c7; color: #fff; border: 0; border-radius: 16px; padding: 14px 24px; font-weight: 800; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>Algumas telas já visitadas continuam disponíveis. Assim que a internet voltar, a Lagos GO atualiza tudo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
